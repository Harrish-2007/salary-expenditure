{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block page_title %}Log in{% endblock %}

{% block content %}
<section class="card narrow">
  <h2>Welcome back</h2>
  <p class="muted">Log in to see your own salary and expenses.</p>
  <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}" class="form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required autocomplete="email" value="{{ form.email }}">
    </div>
    <div class="field">
      <label for="password">Password *</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Log in</button>
      <a href="{{ url_for('register') }}" class="btn">Create an account</a>
    </div>
  </form>
</section>
{% endblock %}
